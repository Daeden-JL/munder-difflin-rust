[package]
name = "md-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
md-contract = { path = "../md-contract" }
md-tenant = { path = "../md-tenant" }
md-pty = { path = "../md-pty" }

axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tokio.workspace = true
tokio-stream = "0.1"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.5"
# Secrets are encrypted at rest. XChaCha20-Poly1305 for the 24-byte nonce:
# random nonces are safe at this size without tracking a counter.
chacha20poly1305 = "0.10"
# Outbound HTTP for integration tests and webhooks. rustls, not the system
# OpenSSL: the runtime image ships no TLS library.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pulled in directly so the crypto provider can be chosen EXPLICITLY at startup.
# With both axum-server and reqwest linking rustls, feature unification leaves
# two providers available and rustls refuses to guess — it panics at the first
# TLS handshake, i.e. at runtime, in production.
rustls = { version = "0.23", features = ["ring"] }
# Webhook capability tokens are stored as a hash, never raw.
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"

[dev-dependencies]
# Backdating a file's mtime, to test that a broken outbox message is eventually
# quarantined rather than retried forever.
filetime = "0.2"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
